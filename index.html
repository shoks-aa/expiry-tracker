<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الصلاحيات">

<title>متابعة الصلاحيات</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#12201c;--mute:#5d6b66;--line:#dbe3df;--main:#0b6b57;--red:#c62828;--amb:#e08600;--grn:#1b7f3b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
header{padding:16px;font-size:20px;font-weight:700}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);padding:9px 14px;border-radius:20px;font-size:15px;color:var(--ink)}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.list{padding:0 12px}
.item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-inline-start:8px solid var(--grn)}
.item.red{border-color:var(--red)}.item.amb{border-color:var(--amb)}
.item h3{margin:0 0 4px;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.badge{font-weight:700;font-size:14px}
.red .badge{color:var(--red)}.amb .badge{color:var(--amb)}.grn .badge{color:var(--grn)}
.del{border:0;background:none;color:var(--red);font-size:14px;padding:6px 0}
.empty{text-align:center;color:var(--mute);padding:40px 20px;line-height:1.8}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar button{flex:1;padding:14px 6px;font-size:16px;border-radius:12px;border:1.5px solid var(--main);background:var(--card);color:var(--main);font-weight:600}
.bar button.pri{background:var(--main);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input{width:100%;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:14px;font-size:16px;border-radius:12px;border:1.5px solid var(--main);background:var(--card);color:var(--main);font-weight:600}
.btns .pri{background:var(--main);color:#fff}
